<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Título e descrição são trocados por página no build (scripts/prerender.mjs) e na navegação. -->
    <title>Triarii Tecnologia</title>
    <meta
      name="description"
      content="Desenvolvimento de sistemas, infraestrutura em nuvem, dados e consultoria técnica para empresas que não podem parar."
    />
    <!-- Compartilhamento (WhatsApp, LinkedIn etc.). URLs absolutas entram no build quando SITE_URL é definido. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Triarii Tecnologia" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Triarii Tecnologia" />
    <meta
      property="og:description"
      content="Desenvolvimento de sistemas, infraestrutura em nuvem, dados e consultoria técnica para empresas que não podem parar."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo Triarii Tecnologia" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#07080F" />
    <meta name="color-scheme" content="dark" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      // Decide antes da primeira pintura se a abertura roda: só na primeira
      // visita da sessão, entrando pela home, e nunca com movimento reduzido.
      try {
        if (
          location.pathname === '/' &&
          !sessionStorage.getItem('triarii-abertura') &&
          !matchMedia('(prefers-reduced-motion: reduce)').matches
        ) {
          document.documentElement.classList.add('tem-abertura');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
